<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>MotoGP Broadcast</title>
<style>
body{margin:22px;font-family:Arial;background:transparent;}
#board{
  position:fixed;
  left:0;
  top:0;
  width:460px;
  height:100%;
  background:linear-gradient(to right, rgba(245,39,39,1), rgba(245,39,39,0.5));
  padding:10px;

  border-radius:20px;        /* 👈 เพิ่ม */
  overflow:hidden;           /* 👈 กันมุมล้น */
}

.fastestBox{
  background:#00ffe1;
  color:white;
  padding:10px;
  margin-bottom:10px;

  border-radius:12px;        /* 👈 เพิ่ม */
}

.row{
  display:flex;
  align-items:center;
  padding:8px;
  margin-bottom:0.4px;
  background:rgba(255,0,255,0.05);
  color:white;
  border-left:4px solid transparent;
  transition:0.3s;

  border-radius:10px;        /* 👈 เพิ่ม */
}
.header{color:white;font-size:22px;margin-bottom:10px;font-weight:bold;}
.fastestBox{background:#00ffe1;color:white;padding:10px;margin-bottom:10px;}
.row{display:flex;align-items:center;padding:8px;margin-bottom:4px;background:rgba(255,0,255,0.05);color:white;border-left:4px solid transparent;transition:0.3s;}
.pos{width:25px;}
.flag{width:30px;}
.name{flex:1;}
.sector{width:60px;text-align:center;}
.time{width:90px;text-align:right;}
.arrow{width:25px;text-align:center;}
.first{background:gold;color:#ffffff;}
.fast{border-left:4px solid #cc00ff;color:#ffffff;}
.ducati{color:red;}
.yamaha{color:#ffffff;}
.honda{color:#ffffff;}
.up{animation:up 0.4s;}
.down{animation:down 0.4s;}
@keyframes up{0%{transform:translateY(10px);opacity:0}100%{transform:translateY(0);opacity:1}}
@keyframes down{0%{transform:translateY(-10px);opacity:0}100%{transform:translateY(0);opacity:1}}
</style>

</head>

<body>

<div id="board">
  <div class="header">🏁 MotoGP LIVE</div>
  <div id="fastestBox" class="fastestBox">REC Time: -</div>
  <div id="list"></div>
</div>

<div id="board">
  <div class="header">🏁 MotoGP LIVE</div>
  <div id="fastestBox" class="fastestBox">REC Time: -</div>
  <div id="list"></div>
</div>

<script>
const url = "https://opensheet.elk.sh/12ZmBNWkrvV0zbYLWhmg6Vbxi3sehI36lwmD6inZjfdU/1";

let prev = {};

function toSec(x){
  if(!x || x=="-") return 9999;
  let p = x.split(":");
  return p[0]*60 + parseFloat(p[1]);
}

function flag(code){
  return code=="TH"?"🇹🇭":
         code=="ES"?"🇪🇸":
         code=="IT"?"🇮🇹":
         code=="JP"?"🇯🇵":"🏳️";
}

async function load(){
  try{
    let res = await fetch(url);
    let raw = await res.json();

    // 🔥 แปลง JSON ให้ตรง
    let data = raw.map(r => ({
      position: parseInt(r.Position),
      name: r.Name,
      lastLap: r.LastLap,
      country: r.Country,
      team: r.Team,
      s1: r.S1,
      s2: r.S2,
      s3: r.S3
    }));

    data.sort((a,b)=>a.position-b.position);

    let fastestTime = Math.min(...data.map(r => toSec(r.lastLap)));
    let fastest = data.find(r => toSec(r.lastLap)==fastestTime);

    if(fastest){
      document.getElementById("fastestBox").innerHTML =
        "⚡ FASTEST: " + fastest.name + " (" + fastest.lastLap + ")";
    }

    let html = "";

    data.forEach(r=>{
      let fast = toSec(r.lastLap)==fastestTime ? "fast" : "";

      let move="";
      let arrow="";

      if(prev[r.name]){
        if(r.position < prev[r.name]){ move="up"; arrow="⬆️"; }
        if(r.position > prev[r.name]){ move="down"; arrow="⬇️"; }
      }

      prev[r.name] = r.position;

      html += `
      <div class="row ${r.position==1?"first":""} ${fast} ${move}">
        <div class="pos">${r.position}</div>
        <div class="arrow">${arrow}</div>
        <div class="flag">${flag(r.country)}</div>
        <div class="name ${r.team || ""}">${r.name}</div>
        <div class="sector">${r.s1||""} ${r.s2||""} ${r.s3||""}</div>
        <div class="time">${r.lastLap}</div>
      </div>`;
    });

    document.getElementById("list").innerHTML = html;

  }catch(e){
    console.log("ERROR:", e);
  }
}

setInterval(load, 3000);
load();

document.onclick = ()=>document.documentElement.requestFullscreen();
</script>

</body>
</html>
:::
